[build-system]
requires = ["setuptools>=77.0.3", "pybind11>=2.10.0"]
build-backend = "setuptools.build_meta"

[project]
name = "depthtensor"
version = "3.0.0"
description = "Tensor math and autograd on CPU and CUDA"
readme = "README.md"
authors = [
    { name = "Hong Ha Le", email = "lehahong1310@gmail.com" }
]
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Operating System :: OS Independent"
]
requires-python = ">=3.10"
dependencies = [
    "numpy"
]

[project.optional-dependencies]
cuda = [
    "cupy"
]

[project.urls]
"Homepage" = "https://github.com/l-h-ha/DepthTensor"
"Bug Tracker" = "https://github.com/l-h-ha/DepthTensor/issues"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
