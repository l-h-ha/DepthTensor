name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install Ruff
        run: pip install ruff
      - name: Run Ruff
        run: ruff check .

  test:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pytest .
      - name: Run tests
        run: pytest

  build:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install build tools
        run: pip install build twine
      - name: Build source distribution
        run: python -m build --sdist
      - name: Verify package metadata
        run: twine check dist/*.tar.gz
      - name: Test source install
        run: |
          python -m pip install dist/*.tar.gz
          python -I - <<'PY'
          import numpy as np
          from depthtensor import Tensor, relu

          x = Tensor([-2.0, 3.0], dtype=np.float64, requires_grad=True)
          y = relu(x)
          y.sum().backward()
          np.testing.assert_array_equal(y.data, [0.0, 3.0])
          np.testing.assert_array_equal(x.grad, [0.0, 1.0])
          PY
      - name: Generate artifact hashes
        if: github.event_name == 'release'
        id: hash
        run: |
          cd dist
          echo "hashes=$(sha256sum *.tar.gz | base64 -w0)" >> "$GITHUB_OUTPUT"
      - name: Upload source distribution
        if: github.event_name == 'release'
        uses: actions/upload-artifact@v6
        with:
          name: python-package-dist
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 1

  provenance:
    if: github.event_name == 'release'
    needs: [build]
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.0.0
    with:
      base64-subjects: ${{ needs.build.outputs.hashes }}
      upload-assets: true

  deploy:
    if: github.event_name == 'release'
    name: Publish to PyPI
    needs: [build, provenance]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
      - name: Download source distribution
        uses: actions/download-artifact@v6
        with:
          name: python-package-dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          print-hash: true
